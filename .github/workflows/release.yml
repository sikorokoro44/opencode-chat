name: Release

# Publishing a signed APK. Triggered by pushing a `v*` tag.
#
# The keystore and its passwords live only in GitHub Secrets; nothing
# sensitive is ever written to the repository or to a build log.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-checks:
    name: Backend typecheck, lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  release:
    name: Lint, test, sign and publish
    needs: backend-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          IFS='.' read -r major minor patch <<< "$version"
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
            echo "Tag '$tag' is not a vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "tag=$tag"        >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code"      >> "$GITHUB_OUTPUT"

      - name: Verify signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${KEYSTORE_B64:-}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${STORE_PASS:-}" ]   || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${KEY_ALIAS:-}" ]    || missing+=("ANDROID_KEY_ALIAS")
          [ -n "${KEY_PASS:-}" ]     || missing+=("ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/release.p12"
          test -s "${RUNNER_TEMP}/release.p12"

      - name: Android lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect, rename and checksum the APK
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/dist"
          mkdir -p "$dir"
          # A signed release build produces app-release.apk. Refuse to publish
          # if the signing config did not apply, so an unsigned APK can never
          # reach a release.
          src="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "Signed release APK not found at $src" >&2
            ls -la android/app/build/outputs/apk/release/ >&2 || true
            exit 1
          fi
          cp "$src" "$dir/opencode-chat.apk"
          cd "$dir"
          sha256sum opencode-chat.apk > opencode-chat.apk.sha256
          cat opencode-chat.apk.sha256
          echo "size=$(stat -c %s opencode-chat.apk)" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature (v1, v2 and v3 required)
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "Using $apksigner"
          apk="$RUNNER_TEMP/dist/opencode-chat.apk"

          echo "--- install-relevant verification ---"
          "$apksigner" verify --verbose "$apk"

          echo "--- per-scheme verification (minSdk 23 forces v1 evaluation) ---"
          report="$("$apksigner" verify --verbose --min-sdk-version 23 "$apk")"
          printf '%s\n' "$report"
          for scheme in "v1 scheme" "v2 scheme" "v3 scheme"; do
            line="$(printf '%s\n' "$report" | grep -F "Verified using $scheme")"
            case "$line" in
              *": true") echo "OK   $scheme" ;;
              *) echo "FAIL $scheme -> $line" >&2; exit 1 ;;
            esac
          done

          echo "--- certificate digest ---"
          "$apksigner" verify --print-certs "$apk"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            ${{ runner.temp }}/dist/opencode-chat.apk
            ${{ runner.temp }}/dist/opencode-chat.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          assets=("$dist/opencode-chat.apk" "$dist/opencode-chat.apk.sha256")

          notes="$(mktemp)"
          {
            echo "opencode-chat $VERSION"
            echo
            echo "Signed release build of the Android client."
            echo
            echo '```'
            echo "sha256sum -c opencode-chat.apk.sha256"
            echo '```'
            echo
            echo "Requires Android 7.0 (API 24) or newer."
          } > "$notes"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of an existing tag: replace the two assets in place.
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --latest \
              --title "opencode-chat $VERSION" \
              --notes-file "$notes"
          fi